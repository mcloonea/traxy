<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags | Traxy</title>
  <link rel="stylesheet" href="../design/style.css">
  <script src="../js/sidebar.js" defer></script>
  <script type="module" src="../js/profile.js"></script>
</head>
<body data-page="tags">
  <div class="app">
    <header class="app-topbar"><h1>Tags</h1></header>
    <aside id="sidebar"></aside>
    <main class="profile-page">
      <section class="profile-card">
        <section class="profile-tags" aria-labelledby="profile-tags-title">
          <div class="profile-tags-heading">
            <h2 id="profile-tags-title">Track tags</h2>
            <p>Use tags to organize and filter your library.</p>
          </div>
          <form class="profile-tag-form" id="tag-form">
            <label class="visually-hidden" for="new-tag">New tag</label>
            <input id="new-tag" name="tag" type="text" maxlength="40" placeholder="Add a tag">
            <button type="submit">Add</button>
          </form>
          <p class="profile-tag-message" id="tag-message" role="status" aria-live="polite"></p>
          <ul class="profile-tag-list" id="profile-tag-list" aria-label="Your tags"></ul>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
