<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Traxy</title>
  <link rel="stylesheet" href="../design/style.css">
  <script src="../js/sidebar.js" defer></script>
  <script type="module" src="../js/chat.js"></script>
</head>
<body data-page="chat">
  <div class="app">
    <header class="app-topbar"><h1>Chat</h1></header>
    <aside id="sidebar"></aside>
    <aside class="history-drawer" id="history-drawer" aria-label="Past conversations" aria-hidden="true">
      <div class="history-heading">
        <h2>Past conversations</h2>
        <button class="history-close" id="history-close" type="button" aria-label="Close past conversations">×</button>
      </div>
      <button class="history-new" id="new-chat-button" type="button">＋ New chat</button>
      <p class="history-status" id="history-status" role="status" aria-live="polite"></p>
      <p class="history-empty" id="history-empty">Your past conversations will appear here.</p>
      <nav class="history-list" id="history-list" aria-label="Conversation history"></nav>
    </aside>
    <main class="chat-page">
      <button class="history-toggle" id="history-toggle" type="button" aria-controls="history-drawer" aria-expanded="false">
        Past chats
      </button>

      <section class="conversation" id="conversation" aria-label="Conversation" aria-live="polite">
        <div class="welcome-message" id="welcome-message">
          <div class="welcome-icon" aria-hidden="true">✦</div>
          <h2>What can I help you with?</h2>
          <p>Ask a question, talk through an idea, or paste a customer conversation.</p>
        </div>
      </section>

      <div class="composer-area">
        <div class="chat-suggestions" id="chat-suggestions" role="listbox" aria-label="Chat suggestions" hidden></div>
        <form class="composer" id="chat-form">
          <div class="composer-input">
            <label class="visually-hidden" for="message-input">Customer conversation or message</label>
            <textarea id="message-input" name="message" rows="1" maxlength="64000" placeholder="Ask anything or paste a customer conversation…" aria-autocomplete="list" aria-controls="chat-suggestions" aria-expanded="false" required></textarea>
          </div>
          <button class="send-button" id="send-button" type="submit" aria-label="Generate responses" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 2.5 14.8 21a.7.7 0 0 1-1.3 0l-3.2-7.3-7.3-3.2a.7.7 0 0 1 0-1.3l18.5-6.7a.7.7 0 0 1 .9.9Z"/><path d="m10.3 13.7 5.1-5.1"/></svg>
          </button>
          <div class="composer-settings">
            <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Response settings" aria-controls="chat-settings" aria-expanded="false" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2.1-.6-2 3.5 1.5 1.7v2.6L2.3 15l2 3.5 2.1-.6 2 .9L9 21h4l.6-2.2 2-.9 2.1.6 2-3.5-1.5-1.7v-2.6L19.7 9l-2-3.5-2.1.6-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg>
            </button>
            <div class="chat-settings" id="chat-settings" role="dialog" aria-label="Response settings" hidden>
              <div id="settings-main">
                <button class="settings-row" id="open-model-settings" type="button">
                  <span class="settings-icon" aria-hidden="true">◈</span><span><strong>Model</strong><small id="selected-model-label">Loading…</small></span><span aria-hidden="true">›</span>
                </button>
                <button class="settings-row" id="open-count-settings" type="button">
                  <span class="settings-icon" aria-hidden="true">≡</span><span><strong>Responses</strong><small id="selected-count-label">3 responses</small></span><span aria-hidden="true">›</span>
                </button>
                <div class="context-meter" id="context-meter" title="Estimated input includes your saved tracks, global prompt, and recent chat.">
                  <div class="context-meter-label"><strong>Context usage</strong><span id="context-label">Loading context…</span></div>
                  <progress id="context-progress" max="100" value="0" aria-label="Context usage"></progress>
                </div>
              </div>
              <div id="settings-model-panel" hidden>
                <button class="settings-back" type="button">‹ Model</button>
                <div id="model-options" role="group" aria-label="Model"></div>
              </div>
              <div id="settings-count-panel" hidden>
                <button class="settings-back" type="button">‹ Responses</button>
                <div class="response-count-options" id="response-count-options" role="group" aria-label="Number of responses">
                  <button type="button" data-count="1" aria-pressed="false">1</button>
                  <button type="button" data-count="2" aria-pressed="false">2</button>
                  <button type="button" data-count="3" aria-pressed="true">3</button>
                </div>
                <p class="settings-help">Choose how many ready-to-send options to generate.</p>
              </div>
              <p class="settings-status" id="settings-status" role="status" aria-live="polite"></p>
            </div>
          </div>
        </form>
        <div class="composer-footer">
          <p class="composer-note" id="composer-note">Enter to send · Shift+Enter for a new line</p>
        </div>
        <p class="composer-status" id="composer-status" role="status" aria-live="polite"></p>
      </div>
    </main>
  </div>
</body>
</html>
